services:
  db:
    image: postgres:16-alpine
    container_name: gantt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gantt
      POSTGRES_PASSWORD: gantt
      POSTGRES_DB: gantt
    ports:
      - "5433:5432"
    volumes:
      - gantt-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gantt -d gantt"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  gantt-data:
