services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgres://gantt:gantt@db:5432/gantt
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: gantt-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gantt
      POSTGRES_PASSWORD: gantt
      POSTGRES_DB: gantt
    ports:
      - "5433:5432"
    volumes:
      - gantt-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gantt -d gantt"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  gantt-data:
